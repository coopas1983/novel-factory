name: NovelPia Publish Episode 2

on:
  workflow_dispatch:
  push:
    paths:
      - "browser_publisher/novelpia_publish_episode2.js"

concurrency:
  group: novelpia-publish-episode2
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser dependencies
        working-directory: browser_publisher
        run: |
          npm install
          npx playwright install --with-deps chromium
      - name: Publish episode 2 with duplicate and readback checks
        working-directory: browser_publisher
        env:
          NOVELPIA_STORAGE_STATE_B64: ${{ secrets.NOVELPIA_STORAGE_STATE_B64 }}
          CONFIRM_PUBLISH: YES
        run: node novelpia_publish_episode2.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: novelpia-episode2-publish-report
          path: browser_publisher/reports/novelpia-episode2-publish.json
          retention-days: 7
