name: QuarterFull Local Publish Controls Diagnose

on:
  push:
    paths:
      - 'browser_publisher/quarterfull-local-publish-controls-trigger.txt'
  workflow_dispatch:

concurrency:
  group: quarterfull-local-profile
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: [self-hosted, Windows, quarterfull]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install publisher dependencies
        working-directory: browser_publisher
        shell: cmd
        run: npm install
      - name: Diagnose QuarterFull publish controls read-only
        working-directory: browser_publisher
        shell: cmd
        run: node quarterfull_local_publish_controls_diagnose.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quarterfull-local-publish-controls-report
          path: browser_publisher/reports/quarterfull-local-publish-controls-diagnose.json
          retention-days: 7
