name: QuarterFull Final Arc Sync 11-15

on:
  push:
    paths:
      - "browser_publisher/quarterfull-final-arc-sync-trigger.txt"

concurrency:
  group: quarterfull-final-arc-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: [self-hosted, Windows, quarterfull]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install publisher dependencies
        working-directory: browser_publisher
        run: npm install
      - name: Sync final arc into QuarterFull
        working-directory: browser_publisher
        run: node quarterfull_local_final_arc_sync.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quarterfull-final-arc-sync-report
          path: browser_publisher/reports/quarterfull-final-arc-sync.json
          retention-days: 7
