name: NovelPia Complete Diagnose

on:
  push:
    paths:
      - "browser_publisher/novelpia-complete-diagnose-trigger.txt"

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser dependencies
        working-directory: browser_publisher
        run: |
          npm install
          npx playwright install --with-deps chromium
      - name: Diagnose completion controls
        working-directory: browser_publisher
        env:
          NOVELPIA_STORAGE_STATE_B64: ${{ secrets.NOVELPIA_STORAGE_STATE_B64 }}
        run: node novelpia_complete_diagnose.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: novelpia-complete-diagnose
          path: browser_publisher/reports/novelpia-complete-diagnose.json
          retention-days: 7
