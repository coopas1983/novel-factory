name: QuarterFull Local File Meta Diagnose

on:
  push:
    paths:
      - 'browser_publisher/quarterfull-file-meta-trigger.txt'
  workflow_dispatch:

concurrency:
  group: quarterfull-local-profile
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: [self-hosted, Windows, quarterfull]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install publisher dependencies
        working-directory: browser_publisher
        shell: cmd
        run: npm install
      - name: Inspect QuarterFull file move metadata read-only
        working-directory: browser_publisher
        shell: cmd
        run: node quarterfull_local_file_meta_diag.js
