name: Factory Patch Bridge

on:
  workflow_dispatch:
    inputs:
      patch_bundle_b64:
        description: "Base64 JSON bundle: {files:[{path,content_b64}], deletes:[]}"
        required: true
        type: string
      commit_message:
        description: "Commit message"
        required: false
        default: "Apply factory patch bundle"
        type: string

permissions:
  contents: write

concurrency:
  group: factory-patch-bridge
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply validated patch bundle
        env:
          PATCH_BUNDLE_B64: ${{ inputs.patch_bundle_b64 }}
        run: |
          python - <<'PY'
          import os, json, base64
          from pathlib import Path, PurePosixPath

          raw=base64.b64decode(os.environ["PATCH_BUNDLE_B64"], validate=True)
          bundle=json.loads(raw.decode("utf-8"))
          files=bundle.get("files", [])
          deletes=bundle.get("deletes", [])
          if not isinstance(files,list) or not isinstance(deletes,list):
              raise SystemExit("INVALID_BUNDLE")
          if len(files)+len(deletes)>50:
              raise SystemExit("TOO_MANY_PATCHES")

          def safe(path):
              if not isinstance(path,str) or not path or path.startswith("/"):
                  return False
              q=PurePosixPath(path)
              return ".." not in q.parts and not (path==".git" or path.startswith(".git/"))

          seen=set()
          for item in files:
              path=item.get("path")
              if not safe(path) or path in seen: raise SystemExit("UNSAFE_OR_DUPLICATE_PATH")
              seen.add(path)
              data=base64.b64decode(item["content_b64"], validate=True)
              data.decode("utf-8")
              p=Path(path); p.parent.mkdir(parents=True,exist_ok=True); p.write_bytes(data)
              print("WROTE", path, len(data))

          for path in deletes:
              if not safe(path) or path in seen: raise SystemExit("UNSAFE_OR_DUPLICATE_PATH")
              seen.add(path)
              p=Path(path)
              if p.exists():
                  p.unlink()
                  print("DELETED", path)
          PY

      - name: Stage and validate
        run: |
          git add -A
          git diff --cached --check
          git diff --cached --stat

      - name: Commit and push
        env:
          COMMIT_MESSAGE: ${{ inputs.commit_message }}
        run: |
          if git diff --cached --quiet; then
            echo "NO_CHANGES"
            exit 0
          fi
          git config user.name "novel-factory-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "$COMMIT_MESSAGE"
          git push
