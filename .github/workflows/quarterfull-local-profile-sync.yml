name: QuarterFull Local Profile Sync

on:
  push:
    paths:
      - 'browser_publisher/quarterfull-local-trigger.txt'
  workflow_dispatch:

concurrency:
  group: quarterfull-local-profile
  cancel-in-progress: true

jobs:
  sync:
    runs-on: [self-hosted, Windows, quarterfull]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install publisher dependencies
        working-directory: browser_publisher
        shell: cmd
        run: npm install
      - name: Verify or sync QuarterFull using local Chrome profile
        working-directory: browser_publisher
        shell: cmd
        run: node quarterfull_local_profile_sync.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quarterfull-local-report
          path: browser_publisher/reports/quarterfull-local-*.json
          retention-days: 7
