name: QuarterFull Local Publish Chapters

on:
  push:
    paths:
      - 'browser_publisher/quarterfull-local-publish-trigger.txt'
  workflow_dispatch:

concurrency:
  group: quarterfull-local-profile
  cancel-in-progress: false

jobs:
  publish:
    runs-on: [self-hosted, Windows, quarterfull]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install publisher dependencies
        working-directory: browser_publisher
        shell: cmd
        run: npm install
      - name: Publish QuarterFull chapters through exact-scoped UI
        working-directory: browser_publisher
        shell: cmd
        run: node quarterfull_local_publish_ui.js
