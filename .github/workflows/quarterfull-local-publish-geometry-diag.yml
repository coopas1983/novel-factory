name: QuarterFull Local Publish Geometry Diagnose

on:
  push:
    paths:
      - 'browser_publisher/quarterfull-publish-geometry-trigger.txt'
  workflow_dispatch:

concurrency:
  group: quarterfull-local-profile
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: [self-hosted, Windows, quarterfull]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install publisher dependencies
        working-directory: browser_publisher
        shell: cmd
        run: npm install
      - name: Diagnose QuarterFull publish button geometry
        working-directory: browser_publisher
        shell: cmd
        run: node quarterfull_local_publish_geometry_diag.js
