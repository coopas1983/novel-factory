name: NovelPia Publish Approved Series
on:
  push:
    paths:
      - "browser_publisher/novelpia-series-publish-trigger.txt"
  workflow_dispatch:
concurrency:
  group: novelpia-publish-approved-series
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser dependencies
        working-directory: browser_publisher
        run: |
          npm install
          npx playwright install --with-deps chromium
      - name: Publish frozen approved episode
        working-directory: browser_publisher
        env:
          NOVELPIA_STORAGE_STATE_B64: ${{ secrets.NOVELPIA_STORAGE_STATE_B64 }}
          CONFIRM_PUBLISH: YES
        run: node novelpia_publish_series.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: novelpia-series-publish-report
          path: browser_publisher/reports/novelpia-episode*-publish.json
          retention-days: 7
