name: Commercial Episode Gate

on:
  workflow_dispatch:
  push:
    paths:
      - "factory/validate_episode_2_ready.py"
      - "books/live-gemini-pilot/commercial/chapter-2.md"
      - "books/live-gemini-pilot/commercial/chapter-2-quality.json"

concurrency:
  group: commercial-episode-gate
  cancel-in-progress: false

jobs:
  commercialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate fixed episode 2 manuscript
        run: python -m factory.validate_episode_2_ready
