name: Commercial Episode Gate

on:
  workflow_dispatch:

jobs:
  commercialize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Commercial edit and quality gate
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          AI_PROVIDER: gemini
        run: python -m factory.commercial_episode
      - name: Commit gated manuscript
        run: |
          git config user.name "novel-factory-bot"
          git config user.email "actions@users.noreply.github.com"
          git add books/live-gemini-pilot/commercial/
          git diff --cached --quiet || git commit -m "Generate commercial episode 1"
          git push
