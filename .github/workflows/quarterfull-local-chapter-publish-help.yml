name: QuarterFull Local Chapter Publish Help

on:
  push:
    paths:
      - 'browser_publisher/quarterfull-local-chapter-publish-help-trigger.txt'
  workflow_dispatch:

concurrency:
  group: quarterfull-local-profile
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: [self-hosted, Windows, quarterfull]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install publisher dependencies
        working-directory: browser_publisher
        shell: cmd
        run: npm install
      - name: Read QuarterFull chapter publishing help
        working-directory: browser_publisher
        shell: cmd
        run: node quarterfull_local_chapter_publish_help.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quarterfull-local-chapter-publish-help-report
          path: browser_publisher/reports/quarterfull-local-chapter-publish-help.json
          retention-days: 7
